name: FD2 Build and Release

# fd2-v 로 시작하는 태그(예: fd2-v0.1.0)를 push 하면 용의기사2 런처를 릴리즈한다.
# v* 태그는 publish.yml(템플릿 NuGet)이 쓰므로 겹치지 않게 앞에 fd2- 를 붙인다.
on:
  push:
    tags:
      - 'fd2-v*'
  # 태그 없이 손으로 돌리면 릴리즈는 안 만들고 exe 를 Actions 산출물로만 올린다.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^fd2-v\d') { $tag = 'fd2-v0.0.0' }
          $version = $tag.Substring(5)
          $parts = $version.Split('.')
          while ($parts.Count -lt 3) { $parts += '0' }
          $version = $parts -join '.'
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # 세이브 연동 — 구글 OAuth 클라이언트(저장소 비밀값 FD2_GOOGLE_CLIENT, 두 줄)를 빌드에 넣는다. 없으면 그 기능만 꺼진다
      - name: Write Google client
        shell: pwsh
        env:
          GOOGLE_CLIENT: ${{ secrets.FD2_GOOGLE_CLIENT }}
        run: |
          if ($env:GOOGLE_CLIENT) { [IO.File]::WriteAllText("src/Fd2/google-client.txt", $env:GOOGLE_CLIENT) }

      # 게임(Fd2.exe)과 편집기(Fd2.Editor.exe)를 각각 설치 없이 도는 단일 exe 로 낸다.
      # 원본 게임 자료는 넣지 않는다 — 둘 다 게임 폴더를 그 자리에서 읽는다.
      # IncludeNativeLibrariesForSelfExtract — Vortice · WPF 가 싣는 네이티브 dll 까지 exe 안에 묶는다.
      - name: Publish (game, editor)
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          foreach ($proj in 'src/Fd2/Fd2.csproj', 'src/Fd2.Editor/Fd2.Editor.csproj') {
            dotnet publish $proj -c Release -r win-x64 --self-contained true -o publish `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true `
              -p:DebugType=none `
              -p:Version=$v -p:AssemblyVersion=$v -p:FileVersion=$v -p:InformationalVersion=$v
            if ($LASTEXITCODE -ne 0) { throw "$proj publish 실패" }
          }
          foreach ($exe in 'Fd2.exe', 'Fd2.Editor.exe') {
            if (-not (Test-Path "publish/$exe")) { throw "publish 에 $exe 가 없습니다" }
          }
          # 두 exe 를 zip 하나로도 묶는다 — exe 를 막는 메일·보안 프로그램을 거치거나 한 번에 받을 때.
          # 게임의 도구 > 편집기 열기는 같은 폴더의 Fd2.Editor.exe 를 띄운다.
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/Fd2.exe, publish/Fd2.Editor.exe -DestinationPath "dist/Fd2-v$v.zip" -Force
          Get-ChildItem publish, dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fd2-${{ steps.version.outputs.version }}
          path: |
            publish/*.exe
            dist/*.zip

      - name: Upload to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/fd2-v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "용의기사2 $tag" --generate-notes
          }
          # 업로드가 GitHub 쪽 500·504 로 가끔 끊긴다 — 파일마다 몇 번 다시 시도한다.
          foreach ($file in "publish/Fd2.exe", "publish/Fd2.Editor.exe", "dist/Fd2-v${{ steps.version.outputs.version }}.zip") {
            for ($try = 1; $try -le 4; $try++) {
              gh release upload $tag $file --clobber
              if ($LASTEXITCODE -eq 0) { break }
              if ($try -eq 4) { exit 1 }
              Write-Host "업로드 실패($file) — $try 번째, 30초 뒤 다시 시도"
              Start-Sleep -Seconds 30
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 릴리즈 본문은 src/Fd2/릴리즈노트.md 의 이 판 대목(「## fd2-v판번호」 아래)이다.
      # 대목이 없으면 본문을 안 건드린다.
      - name: Set release notes
        if: startsWith(github.ref, 'refs/tags/fd2-v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $keep = $false
          $body = foreach ($line in Get-Content -Encoding UTF8 "src/Fd2/릴리즈노트.md") {
            if ($line -match '^## ') { $keep = ($line.Substring(3).Trim() -eq $tag); continue }
            if ($keep) { $line }
          }
          $text = ($body -join "`n").Trim()
          if ($text) {
            Set-Content -Encoding UTF8 -Path notes.md -Value $text
            gh release edit $tag --notes-file notes.md
          } else { Write-Host "릴리즈노트.md 에 $tag 대목이 없습니다 - 본문은 그대로 둡니다" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 안드로이드판 — 게임 로직은 윈도우판과 같은 파일(src/Fd2 의 공용 파일)을 쓰고, 그리기 · 입력만 src/Fd2.Android.
  # 윈도우 작업이 릴리즈를 세운 뒤에 돌아 같은 릴리즈에 APK 를 붙인다. 서명은 기본(디버그 키) — 바로 깔아 쓸 수 있다.
  android:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^fd2-v\d') { $tag = 'fd2-v0.0.0' }
          $parts = @($tag.Substring(5).Split('.'))
          while ($parts.Count -lt 3) { $parts += '0' }
          $version = $parts -join '.'
          # 안드로이드 판 번호(정수) — 0.4.1 → 401
          $code = [int]$parts[0] * 10000 + [int]$parts[1] * 100 + [int]$parts[2]
          if ($code -lt 1) { $code = 1 }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "code=$code" >> $env:GITHUB_OUTPUT

      # 세이브 연동 — 구글 OAuth 클라이언트(저장소 비밀값 FD2_GOOGLE_CLIENT, 두 줄)를 빌드에 넣는다. 없으면 그 기능만 꺼진다
      - name: Write Google client
        shell: pwsh
        env:
          GOOGLE_CLIENT: ${{ secrets.FD2_GOOGLE_CLIENT }}
        run: |
          if ($env:GOOGLE_CLIENT) { [IO.File]::WriteAllText("src/Fd2/google-client.txt", $env:GOOGLE_CLIENT) }

      # 서명 — 저장소 비밀값 ANDROID_KEYSTORE_B64(키 파일 base64) · ANDROID_KEYSTORE_PASS 가 있으면 늘 같은 키로 서명한다
      # (그래야 폰에서 지우지 않고 업데이트된다). 없으면 그때그때 만든 디버그 키 — 판마다 키가 달라 업데이트가 안 된다.
      - name: Publish APK
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $sign = @()
          if ($env:KEYSTORE_B64) {
            $ks = Join-Path $env:RUNNER_TEMP "fd2-release.keystore"
            [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:KEYSTORE_B64))
            $sign = @("-p:AndroidKeyStore=true", "-p:AndroidSigningKeyStore=$ks", "-p:AndroidSigningKeyAlias=fd2",
                      "-p:AndroidSigningKeyPass=$env:KEYSTORE_PASS", "-p:AndroidSigningStorePass=$env:KEYSTORE_PASS")
            Write-Host "고정 키로 서명합니다"
          } else { Write-Host "비밀값이 없어 디버그 키로 서명합니다 — 폰에서 업데이트하려면 지우고 다시 깔아야 합니다" }
          dotnet publish src/Fd2.Android/Fd2.Android.csproj -c Release -f net10.0-android -o apk `
            -p:ApplicationDisplayVersion=$v -p:ApplicationVersion=${{ steps.version.outputs.code }} @sign
          if ($LASTEXITCODE -ne 0) { throw "안드로이드 publish 실패" }
          $signed = Get-ChildItem apk -Filter "*-Signed.apk" | Select-Object -First 1
          if (-not $signed) { throw "서명된 APK 가 없습니다" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $signed.FullName "dist/Fd2-android-v$v.apk"
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fd2-android-${{ steps.version.outputs.version }}
          path: dist/*.apk

      - name: Upload to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/fd2-v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $file = "dist/Fd2-android-v${{ steps.version.outputs.version }}.apk"
          for ($try = 1; $try -le 4; $try++) {
            gh release upload $tag $file --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($try -eq 4) { exit 1 }
            Start-Sleep -Seconds 30
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
