name: FD2 Build and Release

# fd2-v 로 시작하는 태그(예: fd2-v0.1.0)를 push 하면 용의기사2 런처를 릴리즈한다.
# v* 태그는 publish.yml(템플릿 NuGet)이 쓰므로 겹치지 않게 앞에 fd2- 를 붙인다.
on:
  push:
    tags:
      - 'fd2-v*'
  # 태그 없이 손으로 돌리면 릴리즈는 안 만들고 exe 를 Actions 산출물로만 올린다.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^fd2-v\d') { $tag = 'fd2-v0.0.0' }
          $version = $tag.Substring(5)
          $parts = $version.Split('.')
          while ($parts.Count -lt 3) { $parts += '0' }
          $version = $parts -join '.'
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # 설치 없이 도는 단일 exe 로 낸다. 원본 게임 자료는 넣지 않는다 — exe 가 게임 폴더를 그 자리에서 읽는다.
      # IncludeNativeLibrariesForSelfExtract — Vortice 가 싣는 네이티브 dll 까지 exe 안에 묶는다.
      - name: Publish
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          dotnet publish src/Fd2/Fd2.csproj -c Release -r win-x64 --self-contained true -o publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version=$v -p:AssemblyVersion=$v -p:FileVersion=$v -p:InformationalVersion=$v
          if ($LASTEXITCODE -ne 0) { throw "Fd2 publish 실패" }
          if (-not (Test-Path publish/Fd2.exe)) { throw "publish 에 Fd2.exe 가 없습니다" }
          # zip 으로도 묶는다 — exe 를 막는 메일·보안 프로그램을 거칠 때.
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/Fd2.exe -DestinationPath "dist/Fd2-v$v.zip" -Force
          Get-ChildItem publish, dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fd2-${{ steps.version.outputs.version }}
          path: |
            publish/Fd2.exe
            dist/*.zip

      - name: Upload to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/fd2-v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "용의기사2 $tag" --generate-notes
          }
          # 업로드가 GitHub 쪽 500·504 로 가끔 끊긴다 — 파일마다 몇 번 다시 시도한다.
          foreach ($file in "publish/Fd2.exe", "dist/Fd2-v${{ steps.version.outputs.version }}.zip") {
            for ($try = 1; $try -le 4; $try++) {
              gh release upload $tag $file --clobber
              if ($LASTEXITCODE -eq 0) { break }
              if ($try -eq 4) { exit 1 }
              Write-Host "업로드 실패($file) — $try 번째, 30초 뒤 다시 시도"
              Start-Sleep -Seconds 30
            }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 릴리즈 본문은 src/Fd2/릴리즈노트.md 의 이 판 대목(「## fd2-v판번호」 아래)이다.
      # 대목이 없으면 본문을 안 건드린다.
      - name: Set release notes
        if: startsWith(github.ref, 'refs/tags/fd2-v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $keep = $false
          $body = foreach ($line in Get-Content -Encoding UTF8 "src/Fd2/릴리즈노트.md") {
            if ($line -match '^## ') { $keep = ($line.Substring(3).Trim() -eq $tag); continue }
            if ($keep) { $line }
          }
          $text = ($body -join "`n").Trim()
          if ($text) {
            Set-Content -Encoding UTF8 -Path notes.md -Value $text
            gh release edit $tag --notes-file notes.md
          } else { Write-Host "릴리즈노트.md 에 $tag 대목이 없습니다 - 본문은 그대로 둡니다" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
